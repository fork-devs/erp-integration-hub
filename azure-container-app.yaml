# =============================================================================
# MANIFIESTO AZURE CONTAINER APPS (ACA) — ERP INTEGRATION HUB
# =============================================================================

apiVersion: 2024-03-01
location: eastus2
name: erp-integration-hub
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${ACA_ENVIRONMENT_NAME}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8085
      transport: auto
      allowInsecure: false
    secrets:
      - name: db-password
        value: ${INTEGRATION_DB_PASSWORD}
      - name: internal-service-key
        value: ${INTERNAL_SERVICE_KEY}
      - name: s3-access-key-id
        value: ${S3_ACCESS_KEY_ID}
      - name: s3-secret-access-key
        value: ${S3_SECRET_ACCESS_KEY}
      - name: stripe-api-key
        value: ${STRIPE_API_KEY}
      - name: chequea-token
        value: ${CHEQUEA_TOKEN}
      - name: factiliza-token
        value: ${FACTILIZA_TOKEN}
  template:
    containers:
      - name: erp-integration-hub
        image: ${ACR_NAME}.azurecr.io/erp-integration-hub:latest
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: SERVER_PORT
            value: "8085"
          - name: SPRING_PROFILES_ACTIVE
            value: "prod"
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:postgresql://${INTEGRATION_DB_HOST}:${INTEGRATION_DB_PORT}/${INTEGRATION_DB_NAME}?sslmode=require"
          - name: SPRING_DATASOURCE_USERNAME
            value: "${INTEGRATION_DB_USER}"
          - name: SPRING_DATASOURCE_PASSWORD
            secretRef: db-password
          - name: SPRING_FLYWAY_USER
            value: "${INTEGRATION_DB_USER}"
          - name: SPRING_FLYWAY_PASSWORD
            secretRef: db-password
          - name: ERP_APP_DB_PASSWORD
            secretRef: db-password
          - name: ERP_PLATFORM_ROLE_PASSWORD
            secretRef: db-password
          - name: JWKS_URL
            value: "http://erp-auth-service:8081/.well-known/jwks.json"
          - name: INTERNAL_SERVICE_KEY
            secretRef: internal-service-key
          - name: REDIS_HOST
            value: "erp-redis-service"
          - name: REDIS_PORT
            value: "6379"
          - name: S3_ENDPOINT
            value: "${S3_ENDPOINT}"
          - name: S3_BUCKET_NAME
            value: "${S3_BUCKET_NAME}"
          - name: S3_ACCESS_KEY_ID
            secretRef: s3-access-key-id
          - name: S3_SECRET_ACCESS_KEY
            secretRef: s3-secret-access-key
          - name: S3_PUBLIC_URL
            value: "${S3_PUBLIC_URL}"
          - name: STRIPE_API_KEY
            secretRef: stripe-api-key
          - name: CHEQUEA_TOKEN
            secretRef: chequea-token
          - name: FACTILIZA_TOKEN
            secretRef: factiliza-token
        probes:
          - type: Liveness
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 15
          - type: Readiness
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-scaling-rule
          http:
            metadata:
              concurrentRequests: "100"
