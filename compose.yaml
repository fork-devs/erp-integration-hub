services:
  erp-integration-db:
    image: postgres:16-alpine
    container_name: erp-integration-db
    environment:
      POSTGRES_DB: erp_integration_db
      POSTGRES_USER: integration_user
      POSTGRES_PASSWORD: integration_secret
      # El rol de ejecucion (erp_app) y el de plataforma (erp_platform) los
      # crean las migraciones que conceden los permisos. Sus contrasenas las
      # fija la aplicacion en ERP_APP_DB_PASSWORD y
      # ERP_PLATFORM_ROLE_PASSWORD (ver .env.example), que son los valores
      # que las migraciones aplican como placeholders.
    ports:
      - "5434:5432"
    volumes:
      - erp_integration_pgdata:/var/lib/postgresql/data

  erp-integration-redis:
    image: redis:7-alpine
    container_name: erp-integration-redis
    ports:
      - "6382:6379"
    volumes:
      - erp_integration_redisdata:/data

volumes:
  erp_integration_pgdata:
  erp_integration_redisdata:
