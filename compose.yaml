services:
  erp-integration-db:
    image: postgres:16-alpine
    container_name: erp-integration-db
    environment:
      POSTGRES_DB: erp_integration_db
      POSTGRES_USER: integration_user
      POSTGRES_PASSWORD: ${SPRING_FLYWAY_PASSWORD:?defina SPRING_FLYWAY_PASSWORD con la contrasena del rol propietario}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - erp_integration_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U integration_user -d erp_integration_db']
      interval: 5s
      timeout: 5s
      retries: 10

  erp-integration-redis:
    image: redis:7-alpine
    container_name: erp-integration-redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?defina REDIS_PASSWORD con la contrasena de la cache}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD con la contrasena de la cache}
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - erp_integration_redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp_integration_pgdata:
  erp_integration_redisdata:
