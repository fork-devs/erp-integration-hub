server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: erp-integration-hub

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/erp_integration_db}
    username: ${SPRING_DATASOURCE_USERNAME:integration_user}
    password: ${SPRING_DATASOURCE_PASSWORD:integration_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: IntegrationHikariPool
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

erp:
  integration:
    nubefact:
      base-url: ${NUBEFACT_BASE_URL:https://api.nubefact.com/api/v1}
      token: ${NUBEFACT_TOKEN:sandbox_token_nubefact}
      webhook-secret: ${NUBEFACT_WEBHOOK_SECRET:sandbox_nubefact_secret}
      sandbox-mode: ${NUBEFACT_SANDBOX_MODE:true}
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_mock_stripe_key}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_mock_secret}
      sandbox-mode: ${STRIPE_SANDBOX_MODE:true}
    chequea:
      base-url: ${CHEQUEA_BASE_URL:https://api.chequea.pe/v1}
      token: ${CHEQUEA_TOKEN:sandbox_chequea_token}
      sandbox-mode: ${CHEQUEA_SANDBOX_MODE:true}
    apiperu:
      base-url: ${APIPERU_BASE_URL:https://apiperu.dev/api}
      token: ${APIPERU_TOKEN:sandbox_apiperu_token}
      sandbox-mode: ${APIPERU_SANDBOX_MODE:true}
    retry:
      enabled: ${RETRY_ENABLED:true}
      interval-ms: ${RETRY_INTERVAL_MS:5000}
      max-attempts: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.erp.integrationhub: DEBUG
