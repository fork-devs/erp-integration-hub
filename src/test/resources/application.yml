spring:
  application:
    name: erp-integration-hub-test
  # El perfil de test NO define datasource: la configuracion de la base de
  # datos la inyecta AbstractPostgresIntegrationTest, que arranca una
  # instancia real de PostgreSQL en proceso.
  #
  # Antes se usaba H2 con ddl-auto: create-drop y Flyway desactivado, con lo
  # que la politica de Row-Level Security nunca se ejecutaba y una migracion
  # alterada no se detectaba nunca.
  jpa:
    show-sql: false
  flyway:
    enabled: true

erp:
  security:
    internal-service-key: test_internal_key_123
    jwks-url: http://localhost:8081/.well-known/jwks.json
  integration:
    apisunat:
      base-url: https://sandbox.apisunat.pe
      token: test_token
      sandbox-mode: true
    stripe:
      api-key: sk_test_mock
      webhook-secret: whsec_test_mock
      sandbox-mode: true
    chequea:
      base-url: https://api.chequea.pe/v1
      token: test_token
      sandbox-mode: true
    apiperu:
      base-url: https://apiperu.dev/api
      token: test_token
      sandbox-mode: true
    retry:
      enabled: false
      interval-ms: 100000
      max-attempts: 5
